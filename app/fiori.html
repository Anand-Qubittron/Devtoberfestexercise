<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process Center</title>
  <script>
    const app = (id, dir, title, subtitle, icon) => ({
      title, description: subtitle, icon,
      additionalInformation: "SAPUI5.Component=" + id,
      applicationType: "URL", url: "./" + dir + "/webapp", navigationMode: "embedded"
    });
    window["sap-ushell-config"] = {
      defaultRenderer: "fiori2",
      renderers: { fiori2: { componentData: { config: { enableSearch: false } } } },
      applications: {
        "Session-learn":           app("pc.learninghub", "learning-hub", "Learning Hub", "Devtoberfest: what I learned & built", "sap-icon://learning-assistant"),
        "KnowledgeGraph-explore":  app("pc.knowledgegraph", "knowledge-graph", "Knowledge Graph", "Ask questions, see the reasoning", "sap-icon://overview-chart"),
        "ProcessInstance-monitor": app("pc.processmonitor", "process-monitor", "Process Monitor", "Status, retry & resume", "sap-icon://process"),
        "UploadBatch-manage":      app("pc.uploads", "uploads", "Excel Uploads", "Upload → background processing", "sap-icon://excel-attachment"),
        "Supplier-manage":         app("pc.suppliers", "suppliers", "Manage Suppliers", "Master data (draft)", "sap-icon://supplier"),
        "Material-manage":         app("pc.materials", "materials", "Manage Materials", "Master data (draft)", "sap-icon://product"),
        "PurchaseRequest-display": app("pc.purchaserequests", "purchase-requests", "Purchase Requests", "Created by processes", "sap-icon://sales-order"),
        "ObjectLock-display":      app("pc.objectlocks", "object-locks", "Object Locks", "Users & processes", "sap-icon://locked")
      }
    };
  </script>
  <script src="https://ui5.sap.com/1.136.22/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
  <script src="https://ui5.sap.com/1.136.22/resources/sap-ui-core.js"
    data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
    data-sap-ui-compatVersion="edge"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-frameOptions="allow"
    data-sap-ui-bindingSyntax="complex"
    data-sap-ui-async="true"></script>
  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ushell.Container.createRenderer(undefined, true).then(function (renderer) {
        renderer.placeAt("content");
      });
    });
  </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
